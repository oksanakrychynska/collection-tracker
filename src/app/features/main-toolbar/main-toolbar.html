<mat-toolbar color="primary" class="app-toolbar flex-row justify-space-between">
  <div>
    <span class="brand-mark" [routerLink]="['/books']">Трекер колекції</span>

    <button
      [routerLink]="['/trainings']"
      matButton="outlined">
      Trainings
    </button>
  </div>
  <div class="buttons">
    <button
      class="theme-toggle"
      matButton="outlined"
      [attr.aria-pressed]="store.theme() === 'dark'"
      (click)="store.toggleTheme()">
      {{ store.theme() === 'dark' ? 'Light mode' : 'Dark mode' }}
    </button>

    <button
      matButton="outlined"
      type="button"
      (click)="logout()"
      class="logout">Log out</button>
  </div>
</mat-toolbar>
