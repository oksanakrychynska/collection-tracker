<div class="scanner">
  @if (!barcode()) {
    <video
      #video
      autoplay
      playsinline></video>

    <div class="scanner-hint">
      Наведіть камеру на штрихкод книжки
    </div>

    <button
      type="button"
      class="close-button"
      (click)="close()">
      Закрити
    </button>
  }
</div>
