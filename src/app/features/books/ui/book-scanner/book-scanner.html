<div class="scanner">
  <video
    #video
    autoplay
    playsinline
  ></video>

  @if (barcode(); as code) {
    <div class="barcode-result success">
      <div>Штрихкод знайдено:</div>
      <strong>{{ code }}</strong>
    </div>
  } @else {
    <div class="barcode-result">
      Наведіть камеру на штрихкод книжки
    </div>
  }

  <button
    type="button"
    (click)="close()"
  >
    Закрити
  </button>
</div>
