<mat-drawer-container class="example-container">
  <mat-drawer #drawer
              (openedChange)="filtersOpen.set($event)"
              [mode]="isMobile() ? 'over' : 'side'" [opened]="!isMobile() || filtersOpen()">
    <app-filter-panel
      (onBoughtChange)="onBoughtFilterChange($event)"
      (onSeriaChange)="onSeriaFilterChange($event)"
      (onSortChange)="sortToggle()"
      [books]="sortedBooks()"

      [isBought]="isBoughtFilter()"
      [series]=this.series()
      [sortDirection]="sortDirection()"></app-filter-panel>

    <div class="flex-row align-center justify-end close-button">
      <button (click)="drawer.close()" mat-flat-button>Close</button>
    </div>
  </mat-drawer>
  <mat-drawer-content>
    <mat-toolbar-row class="flex-row align-center justify-space-between search-toolbar">

      <app-search-panel (search)="onSearch($event)"></app-search-panel>

      <button (click)="toggleFilters()"
              [attr.aria-expanded]="filtersOpen()"
              class="mobile-filter-toggle"
              matButton="outlined"
              type="button">
        <mat-icon>{{ filtersOpen() ? 'close' : 'tune' }}</mat-icon>
        Filters
      </button>

      <button (click)="openBookForm()"
              [matTooltip]="'Додати книжку'"
              aria-label="Add book"
              class="desktop-add-book"
              mat-icon-button
              type="button">
        <mat-icon>add_circle</mat-icon>
      </button>
    </mat-toolbar-row>

    <div class="books-list-container">
      <mat-list>
        @for (book of sortedBooks(); track book.id) {
          <mat-list-item class="book-list-item">
            <div class="book-row">
             <span class="book-identity">
               <mat-icon [ngClass]="{
               'green': book.seria === Seria.Kanon,
               'orange': book.seria === Seria.VivatClassic,
               'aqua': book.seria === Seria.Dune,
               'shire': book.seria === Seria.Tolkien,
               'coral': book.seria === Seria.GiftClassic,
               'blue': book.seria === Seria.DiscWorld}" class="circle"
                         matListItemIcon
               >circle</mat-icon>
               <span class="flex-column">
                  <span [matTooltip]="book.name.length > 26 ? book.name : ''" class="truncate">{{ book.name }}</span>
               <span class="seria">{{ book.seria }}</span>
               </span>

             </span>
              <span class="book-author">
                <span>{{ book.author.length > 70 ? `Збірка авторів` : book.author }}</span>
              </span>
              <span class="book-status">
                <mat-checkbox [checked]="book.bought" (change)="updateBook(book, 'bought', $event)"></mat-checkbox>
                <mat-checkbox [checked]="book.hadRead" (change)="updateBook(book, 'hadRead', $event)"></mat-checkbox>

                <button matIconButton
                        [matTooltip]="'Редагувати'"
                        (click)="editBook(book)"
                        class="delete-button">
                   <mat-icon>edit</mat-icon>
                 </button>
                 <button matIconButton
                         [matTooltip]="'Видалити зі списку'"
                         [disabled]="book.bought"
                         (click)="deleteBook(book.id)"
                         class="delete-button">
                   <mat-icon>delete</mat-icon>
                 </button>
              </span>
            </div>

          </mat-list-item>
          <mat-divider></mat-divider>
        } @empty {
          <div class="flex-row align-center justify-center empty">
            <p> List is empty</p>
          </div>
        }
      </mat-list>
    </div>

    <button (click)="openBookForm()"
            aria-label="Додати книжку"
            class="mobile-add-book"
            mat-fab
            type="button">
      <mat-icon>add</mat-icon>
    </button>
  </mat-drawer-content>
</mat-drawer-container>
