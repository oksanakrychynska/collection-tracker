<mat-drawer-container class="example-container">
  <mat-drawer [mode]="isMobile() ? 'over' : 'side'"
              [opened]="!isMobile() || filtersOpen()"
              (openedChange)="filtersOpen.set($event)">
    <app-filter-panel
      [books]="sortedBooks()"
      [series]=this.series()
      [isBought]="isBoughtFilter()"
      [sortDirection]="sortDirection()"
      (search)="onSearch($event)"
      (onBoughtChange)="onBoughtFilterChange($event)"
      (onSeriaChange)="onSeriaFilterChange($event)"
      (onSortChange)="sortToggle()"></app-filter-panel>
  </mat-drawer>
  <mat-drawer-content>
    <mat-toolbar-row class="books-actions">
      <button matButton="outlined"
              class="mobile-filter-toggle"
              type="button"
              [attr.aria-expanded]="filtersOpen()"
              (click)="toggleFilters()">
        <mat-icon>{{ filtersOpen() ? 'close' : 'tune' }}</mat-icon>
        Filters
      </button>

      <button mat-icon-button
              class="desktop-add-book"
              type="button"
              aria-label="Add book"
              [matTooltip]="'Додати книжку'"
              (click)="openBookForm()">
        <mat-icon>add_circle</mat-icon>
      </button>
    </mat-toolbar-row>

    <mat-list>
      @for (book of sortedBooks(); track book.id) {
        <mat-list-item class="book-list-item">
          <div class="book-row">
             <span class="book-identity">
               <mat-icon matListItemIcon class="circle"
               [ngClass]="{
               'green': book.seria === Seria.Kanon,
               'orange': book.seria === Seria.VivatClassic,
               'aqua': book.seria === Seria.Dune,
               'shire': book.seria === Seria.Tolkien,
               'coral': book.seria === Seria.GiftClassic,
               'blue': book.seria === Seria.DiscWorld}"
               >circle</mat-icon>
               <span class="flex-column">
                  <span class="truncate" [matTooltip]="book.name.length > 26 ? book.name : ''">{{ book.name }}</span>
               <span class="seria">{{book.seria}}</span>
               </span>

             </span>
            <span class="book-author">
              <span>{{ book.author.length > 70 ? `Збірка авторів` : book.author }}</span>
            </span>
            <span class="book-status">
              <mat-checkbox [checked]="book.bought"></mat-checkbox>
              <mat-checkbox [checked]="book.hadRead"></mat-checkbox>
            </span>
          </div>
        </mat-list-item>
        <mat-divider></mat-divider>
      } @empty {
        <div class="flex-row align-center justify-center empty">
          <p> List is empty</p>
        </div>
      }
    </mat-list>

    <button mat-fab
            class="mobile-add-book"
            type="button"
            aria-label="Додати книжку"
            (click)="openBookForm()">
      <mat-icon>add</mat-icon>
    </button>
  </mat-drawer-content>
</mat-drawer-container>
