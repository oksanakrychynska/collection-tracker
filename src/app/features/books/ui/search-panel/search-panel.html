<mat-form-field class="flex-row width-100" appearance="outline">
  <mat-label>Шукати за назвою книги</mat-label>
  <input matInput type="text" [formControl]="filterInput">
  @if (filterInput.value) {
    <button matSuffix matIconButton aria-label="Clear" (click)="filterInput.reset()">
      <mat-icon>close</mat-icon>
    </button>
  }
</mat-form-field>
