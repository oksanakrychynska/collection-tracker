<div>
  <div class="flex-row align-center justify-space-between">
    <mat-slide-toggle (change)="sortToggle()"
                      [checked]="sortDirection() === 'asc'"
                      labelPosition="before">Сортувати А-Я
    </mat-slide-toggle>
    <span class="hint total">Знайдено: {{books()?.length}}</span>
  </div>


  <p class="hint">Книги:</p>
  <div class="flex-row align-center justify-center toggle">

    <mat-button-toggle-group name="books"
                             aria-label="Books"
                             [value]="isBought()"
                             (change)="onIsBought($event)">
      <mat-button-toggle value="all">Усі книги</mat-button-toggle>
      <mat-button-toggle value="bought">Куплені</mat-button-toggle>
      <mat-button-toggle value="notBought">Не куплені</mat-button-toggle>
    </mat-button-toggle-group>
  </div>

  <section class="example-section">
  <span class="example-list-section">
    <mat-checkbox
      (change)="update($event)"
      [checked]="filter().selected"
      [indeterminate]="partiallyComplete()"
      class="example-margin">
      {{ filter().name }}
    </mat-checkbox>
  </span>
    <span class="example-list-section">
    <ul>
      @for (subfilter of filter().subfilters; track subfilter; let i = $index) {
        <li>
          <mat-checkbox (change)="update($event, i)" [checked]="subfilter.selected">
            {{ subfilter.name }}
          </mat-checkbox>
        </li>
      }
    </ul>
  </span>
  </section>

  <mat-divider></mat-divider>

</div>
