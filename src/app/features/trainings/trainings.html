

<div class="flex-row align-center justify-center width-100 gap-2">
  <div class="width-50 margin">
    <p>this is parent component</p>
    <p>Parent: {{ user.name }}</p>
    <p>Parent signal: {{ user2().name }}</p>
    <button mat-flat-button (click)="updateUser()">Update user</button>
  </div>

  <div class="width-50 margin" >


    <app-trainings-child [user]="user" [user2]="user2()"></app-trainings-child>
  </div>

</div>

<div class="margin">
  @for (item of this.frequencies | keyvalue; track item.key) {
    <div class="map-item">
      Arr number: {{ item.key }} | Frequency: {{ item.value }}
    </div>
  } @empty {
    <p>No map entries found.</p>
  }
</div>
